<style>.aa-chart{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);--anthropic:#eb6834;--openai:#1baf7a;--google:#2a78d6;--other:#898781}
